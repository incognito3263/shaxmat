name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            
            # Serverda git konfiguratsiyasini to'g'irlash
            git config --global --add safe.directory ${{ secrets.PROJECT_PATH }}
            
            # GitHub'dagi yangiliklarni majburan olish (Conflict-larni chetlab o'tish uchun)
            git fetch --all
            git reset --hard origin/main
            
            # Docker: keshsiz build (prodda eski frontend qolmasin), keyin ishga tushirish
            docker-compose down
            docker-compose build --no-cache
            docker-compose up -d
            
            # Eskirgan docker image-larni tozalash
            docker image prune -f
